<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      var coverSupport = 'CSS' in window && typeof CSS.supports === 'function' && (CSS.supports('top: env(a)') ||
        CSS.supports('top: constant(a)'))
      document.write(
        '<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0' +
        (coverSupport ? ', viewport-fit=cover' : '') + '" />')
    </script>
    <title>内行商城 - 课程・商城・活动一站式服务平台</title>
    <meta name="description" content="内行商城提供在线课程、商品购买与活动报名服务，支持多租户品牌定制，一站式私域运营与消费体验。" />
    <!-- OG 标签：og:image 由构建产物静态目录提供；租户级动态元数据由 useSeoMeta 运行时注入 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="内行商城 - 课程・商城・活动一站式服务平台" />
    <meta property="og:description" content="在线课程、商品购买与活动报名，一站式私域运营与消费体验。" />
    <meta property="og:image" content="/h5/static/logo.png" />
    <!-- 品牌 JSON-LD（Organization）：租户级动态内容由页面 useSeoMeta 补充 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "内行商城",
        "url": "https://www.neihang.com/h5/",
        "logo": "https://www.neihang.com/h5/static/logo.png"
      }
    </script>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"><!--app-html--></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
